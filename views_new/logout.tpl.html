{# Abmelden ist eine Aenderung und laeuft deshalb ueber ein Formular mit Token.
   Diese Seite sieht nur, wer /logout.php direkt aufruft — aus dem Menue heraus
   wird gleich abgeschickt. #}
<div class="card form-card" style="max-width:420px;margin:40px auto;padding:26px">
  <h2 style="margin:0 0 10px;font-size:19px">{{ t('logout_abmelden') }}</h2>
  <p style="color:var(--text-muted);font-size:14px;margin:0 0 18px">
    {{ t('logout_moechtest_du_dich_von') }}
  </p>
  <form method="post" action="{{ url('/logout.php') }}" style="display:flex;gap:10px">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-primary">{{ t('logout_abmelden') }}</button>
    <a href="{{ url('/index.php') }}" class="btn btn-ghost">{{ t('logout_abbrechen') }}</a>
  </form>
</div>
