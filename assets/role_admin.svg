<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#0c1830"/>
      <stop offset="100%" stop-color="#04081a"/>
    </linearGradient>
    <linearGradient id="adminBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="adminGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="adminBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <circle cx="100" cy="100" r="100" fill="url(#adminBg)"/>

  <!-- Blauer Glow -->
  <circle cx="100" cy="100" r="80" fill="url(#adminGlow)"/>

  <!-- Schild-Glow -->
  <path d="M100,28 L160,48 L160,108 Q160,150 100,177 Q40,150 40,108 L40,48 Z"
        fill="none" stroke="url(#adminBlue)" stroke-width="3" filter="url(#adminBlur)" opacity="0.7"/>
  <!-- Schild-Outline -->
  <path d="M100,28 L160,48 L160,108 Q160,150 100,177 Q40,150 40,108 L40,48 Z"
        fill="rgba(59,130,246,0.05)" stroke="url(#adminBlue)" stroke-width="2"/>

  <!-- Tech-Verzierungen oben/unten -->
  <line x1="60" y1="40" x2="80" y2="40" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <line x1="120" y1="40" x2="140" y2="40" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>

  <!-- Großes A in der Mitte -->
  <g transform="translate(100,85)">
    <!-- Hex-Hintergrund hinter dem A -->
    <polygon points="-30,-25 30,-25 40,0 30,25 -30,25 -40,0"
             fill="rgba(59,130,246,0.15)" stroke="url(#adminBlue)" stroke-width="1.5"/>
    <!-- A -->
    <text x="0" y="12" text-anchor="middle"
          font-family="Arial Black, Impact, sans-serif" font-size="42"
          fill="url(#adminBlue)" font-weight="900">A</text>
  </g>

  <!-- ADMIN-Banner unten -->
  <g transform="translate(100,135)">
    <rect x="-44" y="-3" width="88" height="22" rx="3" fill="rgba(0,0,0,0.7)"
          stroke="url(#adminBlue)" stroke-width="1.5"/>
    <text x="0" y="13" text-anchor="middle"
          font-family="Arial Black, Impact, sans-serif" font-size="13"
          fill="url(#adminBlue)" font-weight="900" letter-spacing="2.5">ADMIN</text>
  </g>

  <!-- Dekoratives Glow-Element -->
  <circle cx="100" cy="160" r="2" fill="#60a5fa"/>
</svg>
