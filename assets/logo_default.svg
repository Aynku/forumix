<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" height="100" preserveAspectRatio="xMinYMid meet">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Adaptiver Text-Verlauf: weicher Indigo-zu-Lila-Übergang funktioniert auf beiden Themes -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Logo-Symbol -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="68" height="60" rx="18" ry="18" fill="url(#logoGrad)"/>
    <path d="M 18 60 L 22 76 L 32 60 Z" fill="url(#logoGrad)"/>
    <circle cx="18" cy="30" r="5" fill="white" opacity="0.95"/>
    <circle cx="34" cy="30" r="5" fill="white" opacity="0.95"/>
    <circle cx="50" cy="30" r="5" fill="white" opacity="0.95"/>
  </g>

  <!-- Text "aynku" - Indigo-Verlauf sieht auf Dark wie Light gut aus -->
  <text x="95" y="62" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="40" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
    aynku
  </text>

  <!-- Untertitel "FORUM" - mittelgrau, neutral -->
  <text x="98" y="86" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#888a98" letter-spacing="4">
    FORUM
  </text>

  <!-- Akzent-Punkt -->
  <circle cx="220" cy="58" r="4" fill="#818cf8"/>
</svg>
