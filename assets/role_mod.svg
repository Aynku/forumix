<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="modBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#0c2018"/>
      <stop offset="100%" stop-color="#04100a"/>
    </linearGradient>
    <linearGradient id="modGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#bbf7d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="modGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="modBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <circle cx="100" cy="100" r="100" fill="url(#modBg)"/>

  <!-- Grüner Glow -->
  <circle cx="100" cy="100" r="80" fill="url(#modGlow)"/>

  <!-- Schild-Glow -->
  <path d="M100,28 L160,48 L160,108 Q160,150 100,177 Q40,150 40,108 L40,48 Z"
        fill="none" stroke="url(#modGreen)" stroke-width="3" filter="url(#modBlur)" opacity="0.7"/>
  <!-- Schild-Outline -->
  <path d="M100,28 L160,48 L160,108 Q160,150 100,177 Q40,150 40,108 L40,48 Z"
        fill="rgba(16,185,129,0.06)" stroke="url(#modGreen)" stroke-width="2"/>

  <!-- Tech-Verzierungen -->
  <line x1="60" y1="40" x2="80" y2="40" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
  <line x1="120" y1="40" x2="140" y2="40" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>

  <!-- Inneres Schild (Wächter-Symbol) -->
  <g transform="translate(100,85)">
    <!-- Hex-Hintergrund -->
    <polygon points="-30,-25 30,-25 40,0 30,25 -30,25 -40,0"
             fill="rgba(16,185,129,0.15)" stroke="url(#modGreen)" stroke-width="1.5"/>
    <!-- Schild-Icon innen -->
    <path d="M0,-18 L18,-10 L18,5 Q18,18 0,25 Q-18,18 -18,5 L-18,-10 Z"
          fill="rgba(16,185,129,0.2)" stroke="url(#modGreen)" stroke-width="2"/>
    <!-- Häkchen innen -->
    <path d="M-8,-1 L-3,5 L8,-7" fill="none" stroke="url(#modGreen)"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MOD-Banner unten -->
  <g transform="translate(100,135)">
    <rect x="-40" y="-3" width="80" height="22" rx="3" fill="rgba(0,0,0,0.7)"
          stroke="url(#modGreen)" stroke-width="1.5"/>
    <text x="0" y="13" text-anchor="middle"
          font-family="Arial Black, Impact, sans-serif" font-size="13"
          fill="url(#modGreen)" font-weight="900" letter-spacing="2.5">MOD</text>
  </g>

  <!-- Dekorativer Punkt -->
  <circle cx="100" cy="160" r="2" fill="#34d399"/>
</svg>
