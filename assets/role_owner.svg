<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ownerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="ownerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="ownerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="ownerBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Dunkler Hintergrund -->
  <circle cx="100" cy="100" r="100" fill="url(#ownerBg)"/>

  <!-- Goldener Glow im Hintergrund -->
  <circle cx="100" cy="100" r="80" fill="url(#ownerGlow)"/>

  <!-- Schild-Form -->
  <path d="M100,30 L160,50 L160,110 Q160,150 100,175 Q40,150 40,110 L40,50 Z"
        fill="none" stroke="url(#ownerGold)" stroke-width="3" filter="url(#ownerBlur)" opacity="0.7"/>
  <path d="M100,30 L160,50 L160,110 Q160,150 100,175 Q40,150 40,110 L40,50 Z"
        fill="rgba(245,158,11,0.08)" stroke="url(#ownerGold)" stroke-width="2"/>

  <!-- Krone -->
  <g transform="translate(100,80)">
    <!-- Krone-Basis -->
    <rect x="-30" y="0" width="60" height="12" rx="2" fill="url(#ownerGold)"/>
    <!-- Zacken -->
    <path d="M-30,0 L-20,-20 L-10,-5 L0,-25 L10,-5 L20,-20 L30,0 Z" fill="url(#ownerGold)"/>
    <!-- Edelsteine -->
    <circle cx="-20" cy="-15" r="3" fill="#dc2626"/>
    <circle cx="0"   cy="-20" r="4" fill="#7c3aed"/>
    <circle cx="20"  cy="-15" r="3" fill="#10b981"/>
    <!-- Mittlere Linie auf Basis -->
    <line x1="-25" y1="6" x2="25" y2="6" stroke="#92400e" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- OWNER Text -->
  <g transform="translate(100,130)">
    <rect x="-45" y="-3" width="90" height="22" rx="3" fill="rgba(0,0,0,0.6)"
          stroke="url(#ownerGold)" stroke-width="1.5"/>
    <text x="0" y="13" text-anchor="middle"
          font-family="Arial Black, Impact, sans-serif" font-size="14"
          fill="url(#ownerGold)" font-weight="900" letter-spacing="2">OWNER</text>
  </g>
</svg>
